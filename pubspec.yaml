name: mobile_hub_approval
description: "Unified Approval Management Application — aggregate approval workflows from multiple source systems."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Functional Programming (Either, Option for error handling)
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Navigation
  go_router: ^15.1.2

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation Tools
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
